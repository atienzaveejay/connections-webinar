## Part 1: What I type into LinkedIn Recruiter

**Title:** What I type into LinkedIn Recruiter (the recruiter's side, part 1)

**Hook (to camera):** I'm a recruiter. This is the exact search I run, and why most profiles never show up in it.

**Body (over the screen recording):** First, the job title. Then the location. Then one must-have skill. Every filter I add, the list gets shorter. This one is down to [say the number on your screen] people. If your profile doesn't use the title I typed, or your location is set somewhere else, or that skill isn't listed, you're not on this list, however strong your experience is.

**Close (to camera):** On Friday, November 6 at 12pm ET, Kate Lewis and I run a live search like this and show you how to show up in it. It's free. Scan the code to save your spot.

**Screen:** Recruiter search: type a job title, add a location, add one skill under Must have, show the result count drop each time.

## Part 2: Your headline

**Title:** Don't use your LinkedIn headline to advertise your employer (part 2)

**Hook:** As a recruiter, when a headline looks like this, I scroll right past it.

**Body:** "Director at Company X." It's what most leaders write, and it tells me who you work for. It doesn't tell me what you're good at, and it won't match the words I searched for. Your headline should be your job title plus the strengths you want to be hired for. Instead of "Director at Company X," try "IT Operations Leader, Infrastructure Modernization, Scaling Teams."

**Close:** On November 6 at 12pm ET, Kate Lewis and I are walking through how recruiters find people on LinkedIn. It's free. Scan the code to save your spot.

**On screen:** "Director at Company X" on screen from the first second (the hook points at it), then the after headline as text.

## Part 3: Open to Work

**Title:** Should you turn on Open to Work? A recruiter's answer (part 3)

**Hook:** Should you turn on Open to Work? Here's what I see on my side.

**Body:** In LinkedIn Recruiter, the top of my search shows how many people are open to work, and one click narrows the list to just them. In one search for a Salesforce architect in Raleigh-Durham, that was 42 out of 109. You can turn it on for recruiters only, with no green banner. LinkedIn tries to hide it from recruiters at your own company, but can't promise that. Then fill in your job titles and locations.

**Close:** More settings like this on November 6 at 12pm ET, with Kate Lewis and me. Free. Scan the code.

**On screen:** workbook p. 25 screenshot of the Spotlights row (42 Open to work, 26 Active talent), names blurred.

## Part 4: Skills

**Title:** Recruiters filter by skill. Is yours on your profile? (part 4)

**Hook:** If this one thing isn't on your profile, I can't find you in a search.

**Body (over the screen recording, then to camera):** It's your skills. Watch the list drop when I add one must-have skill. So pick the five skills you most want to be known for and put them in your Top Skills. Then add up to five skills to each job in your experience. Only the first three show on your profile without a click, so put your most important ones first, then ask former colleagues to endorse them.

**Close:** More of this, live, on November 6 at 12pm ET with Kate Lewis and me. It's free. Scan the code.

**Screen:** add one skill under Must have, show the count drop.

## Part 5: Location

**Title:** Open to moving? Your LinkedIn location could be hiding you (part 5)

**Hook:** Between roles and open to moving? Your LinkedIn location could be hiding you from recruiters.

**Body:** When I search, location is one of the first filters I set. If your profile says Chicago and I'm searching Raleigh-Durham, you won't come up, even if you'd move tomorrow. There are two places to fix. Set the location on your profile to where you want to work. Then add every city you'd really take a job in to your Open to Work settings, including remote if you'd take it.

**Close:** Kate Lewis and I show the whole search live on November 6 at 12pm ET. Free on Zoom. Scan the code.

**On screen:** "Profile location" and "Open to Work: locations" as two text cards.

## Part 6: Two questions to ask a recruiter

**Title:** A recruiter messaged you on LinkedIn? Ask these two questions (part 6)

**Hook:** A recruiter reached out about a role? Before you talk about money, ask these two questions.

**Body:** One: are you working on this search exclusively, or are other firms on it too? That tells you how close the recruiter is to the company and how much they can do for you. Two: what prompted this search? Is it a new role or a replacement? The answer tells you what the company is trying to fix, so you know what to talk about in the interview.

**Close:** Kate Lewis and I answer your recruiter questions live tomorrow, Friday at 12pm ET. Free on Zoom. Scan the code.

**On screen:** each question as a text card while she says it.

## Part 7: The role isn't a fit?

**Title:** The role isn't a fit? Ask the recruiter this before you hang up (part 7)

**Hook:** A recruiter told you the role isn't the right fit? Don't hang up yet.

**Body:** Ask two things. Are there other roles you think might fit my background? And could you give me feedback on my resume or my LinkedIn profile? Recruiters look at a lot of profiles. Even when the role isn't yours, that feedback costs you nothing, and it keeps you on their radar for the next one.

**Close:** Kate Lewis and I are live today at 12pm ET, running a real Recruiter search and taking your questions. It's free on Zoom, and there's still time to sign up. Scan the code.

**On screen:** both questions as text cards.

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
document.querySelectorAll('section').forEach(sec => {
  const doc = sec.querySelector('.doc');
  doc.innerHTML = marked.parse(sec.querySelector('script[type="text/markdown"]').textContent, {gfm:true,breaks:true});
  doc.querySelectorAll('a').forEach(a => {a.target = '_blank'; a.rel = 'noopener'});
  // copy button on each section heading, copies everything up to the next h2
  if (sec.dataset.copy) doc.querySelectorAll('h2').forEach(h => {
    const b = document.createElement('button');
    b.className = 'copy'; b.textContent = 'Copy section';
    b.onclick = () => {
      const parts = [];
      for (let n = h.nextElementSibling; n && n.tagName !== 'H2'; n = n.nextElementSibling) parts.push(n.innerText);
      navigator.clipboard.writeText(parts.join('\n\n')).then(() => {b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy section', 1500)});
    };
    h.appendChild(b);
  });
  const boxes = [...doc.querySelectorAll('input[type=checkbox]')];
  if (!boxes.length) return;
  const key = 'nov-updates-' + sec.id, saved = store.get(key);
  const prog = document.createElement('p'); prog.className = 'progress'; doc.prepend(prog);
  const update = () => {
    const n = boxes.filter(b => b.checked).length;
    prog.textContent = n + ' of ' + boxes.length + ' done';
  };
  boxes.forEach((b, i) => {
    b.disabled = false; b.checked = !!saved[i];
    b.closest('li').classList.toggle('done', b.checked);
    b.onchange = () => {saved[i] = b.checked; store.set(key, saved); b.closest('li').classList.toggle('done', b.checked); update()};
  });
  update();
});
const tabs = [...document.querySelectorAll('nav button')];
function show(id){
  tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.tab === id));
  document.querySelectorAll('section').forEach(s => s.hidden = s.id !== id);
}
tabs.forEach(t => t.onclick = () => {show(t.dataset.tab); history.replaceState(null, '', '#' + t.dataset.tab)});
show(tabs.some(t => t.dataset.tab === location.hash.slice(1)) ? location.hash.slice(1) : tabs[0].dataset.tab);
</script>
