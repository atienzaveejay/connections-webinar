<section id="free-webinar" data-copy="1"><div class="doc"></div><script type="text/markdown"># /free-webinar: page copy for Fri 6 Nov 2026

Draft, 25 Oct 2026. For Krizza to paste into the existing Wix page. Keep the current layout and blocks; only the words and links change.

- Every button on this page goes to the Zoom registration: https://us06web.zoom.us/meeting/register/59aYBEa-RoyZswntRVS1ZA
- Remove the old Microsoft Form and anything that says "October 2" (the hero still reads "October 2, 2016").
- Lines marked **[KRIZZA LINE]** come out if Krizza is not co-hosting.

---

## 1. Hero

**Small label:** Free webinar

**Headline:** How to Stand Out to Recruiters on LinkedIn

**Subhead:** For managers, directors and VPs. See what a recruiter sees when they search LinkedIn, then fix the parts of your profile that decide whether you show up.

**Date line:** Friday, November 6, 2026, 12:00 to 1:00pm ET

**Button:** Save my free seat → Zoom link above

**Under the button:** Free on Zoom. No card needed.

## 2. Details strip (the four boxes)

| Box | Text |
|---|---|
| When | Friday, November 6, 2026, 12:00 to 1:00pm ET |
| Where | Online, on Zoom |
| Cost | Free. No card needed. |
| Hosts | Kate Lewis and Krizza Levardo **[KRIZZA LINE: if dropped, the box reads "Host: Kate Lewis"]** |

## 3. Intro

**Heading:** Recruiters don't browse LinkedIn. They filter it.

**Body:**
When a recruiter has a role to fill, they open LinkedIn Recruiter, enter a job title and location, and add the skills the role needs. Anyone outside those filters never appears in the results, however strong their experience.

This is how Kate searches when she fills roles for her clients. In this hour she runs a sample search on her own Recruiter account and shows how fast the number of results drops as each filter goes on. Then she goes through the parts of your profile that decide which side of the filter you land on.

*(Note for Krizza: Kate shows filters and result counts only. No real candidate names or photos appear on screen.)*

## 4. What you'll learn

**Heading:** What we'll cover

**Subhead:** One hour, four changes you can make the same day.

1. **How a recruiter search works.** The filters a recruiter uses, and why qualified people drop out of the results before anyone reads their profile.
2. **The top of your profile.** What your headline and banner tell a recruiter in the first few seconds, and why "Director at Company X" isn't enough.
3. **Your skills.** How to choose the five skills you want to be found for, where to add them, and why the order matters.
4. **Location and Open to Work.** How the wrong location setting hides you from the roles you want, and how to turn on Open to Work so only recruiters can see it.

## 5. Who it's for

**Heading:** Who it's for

**Body:**
Managers, directors and VPs who are between roles, or who are employed and quietly looking at what's next. If you've applied for jobs you were well qualified for and heard nothing back, start here.

**Small box, heading:** Bring your profile
**Small box, body:** Have LinkedIn open in another tab. Most people change something on their profile before the hour is up.

## 6. About the hosts

**Heading:** Meet your hosts

**Kate Lewis**
Kate is the founder of Connections Consulting Partners, a Raleigh recruiting firm that places technical, sales and leadership talent. She also hosts Leaders in Transition, a group for professionals in a job search.

She is a working recruiter with a LinkedIn Recruiter seat, so the search you see on Friday is the same one she uses to fill real roles.

**[KRIZZA LINE]** **Krizza Levardo**, Recruiting Partner at Connections Consulting Partners, co-hosts the session.

*(The old page mentioned Kate's NC TECH Summit panel. Keep it only if Kate still wants it there; it was a September event.)*

## 7. FAQ

**Is it really free?**
Yes. No card needed.

**How do I join?**
Register through the Zoom link on this page. Zoom emails you your join link as soon as you sign up.

**Do I need LinkedIn Premium?**
No. Everything we cover works on a free LinkedIn account.

**What if I can't make it live?**
This session is live only, so join us on the day if you can. Our next free webinar is on Friday, December 4, and the details are on our Events page.

*(Remove the old answer "Everyone who signs up gets the recording." There is no recording promise for this session.)*

**Line 1:** Friday, November 6, 12:00pm ET

**Line 2:** One free hour on Zoom. Bring your profile.

## 2. Intro

**Small label:** Leaders in Transition

**Heading:** Job search help for managers, directors and VPs

**Body:**
Leaders in Transition (LIT) is run by Kate Lewis, founder of Connections Consulting Partners and a working recruiter. It is for leaders who are between roles, and for those who are still employed and quietly looking.

Start with three live workshops on Zoom, taken in order. Each one is a small-group working session where you work on your own materials with Kate. After Fundamentals and Advanced, you can join LIT Lab, a weekly group where you keep practicing until you land your next role.

## 3. Workshops

**Heading:** The three LIT workshops

**Subhead:** Live on Zoom, small groups, taught by Kate. Take them in order: Fundamentals, then Advanced, then Executive.

### Step 1: LIT Fundamentals ($250)

**Dates:** Tuesday, November 10, 11:00am to 1:00pm ET **[TIME TO CONFIRM WITH KRIZZA]**, or Tuesday, December 8

**What you'll do:** Rewrite the top third of your resume for the role you want next, then update the LinkedIn sections recruiters search on: your headline, your skills, your location and your Open to Work setting.

**Open to:** Anyone. Start here.

**Button:** Book Fundamentals, $250 → https://buy.stripe.com/fZucN4eD28Os2YK4WFdAk0n

### Step 2: LIT Advanced ($350)

**Dates:** Tuesday, November 17, 11:00am to 2:00pm ET, or Tuesday, December 15

**What you'll do:** Run your search like a sales pipeline. Build your pitch, ask for referrals, work with recruiters, and use Kate's Job Qualification Matrix to decide which roles are worth your time. The session closes with interview preparation and salary negotiation.

**Open to:** People who have completed LIT Fundamentals.

**Button:** Book Advanced, $350 → https://buy.stripe.com/5kQ6oGdyY7KogPA60JdAk0o

### Step 3: LIT Executive ($450)

**Dates:** Tuesday, December 1, 11:00am to 1:00pm ET, or Tuesday, December 29

**What you'll do:** Define the personal brand you want to be known for as a senior leader, and leave with a brand statement you can use on LinkedIn and in your bio.

**Open to:** Senior leaders who have completed LIT Advanced.

**Button:** Book Executive, $450 → https://buy.stripe.com/28EaEW9iIaWA7f088RdAk0p

**Line under the three tiers:** After you book, we'll confirm your date and send your Zoom link. **[CONFIRM: how buyers pick Nov vs Dec, since the Stripe links don't ask for a date]**

## 4. LIT Lab (replaces the Twelve-Week Program)

**Small label:** After the workshops

**Heading:** LIT Lab: weekly practice with Kate and Krizza

**Body:**
The workshops teach the method. LIT Lab is where you use it every week. Kate compares it to a group class at the gym: you could work out at home, but most people show up more often and push harder when there's a group and a coach in the room.

Each week is a one-hour live session on Zoom, run by Kate and Krizza. There is no set topic. You bring what's happening in your search and the group works on it with you.

**Each session can include:**
- Mock interviews and role play, including salary conversations
- Practice on your pitch and your outreach to contacts and recruiters
- Help with a live situation, such as an offer, a tricky interview question or a referral ask
- Support and accountability from people in the same position

**Details:**
- **Price:** $100 a month. No end date, cancel anytime.
- **Starts:** December 1, 2026
- **When:** Weekly, Thursday mornings ET **[DAY AND TIME TO CONFIRM]**

**Button:** Join LIT Lab, $100/month → **[LINK TO CONFIRM: reuse https://buy.stripe.com/4gM4gyeD21m06aW60JdAk0i or a new LIT Lab link?]**

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
document.querySelectorAll('section').forEach(sec => {
  const doc = sec.querySelector('.doc');
  doc.innerHTML = marked.parse(sec.querySelector('script[type="text/markdown"]').textContent, {gfm:true});
  doc.querySelectorAll('a').forEach(a => {a.target = '_blank'; a.rel = 'noopener'});
  // copy button on each section heading, copies everything up to the next h2
  if (sec.dataset.copy) doc.querySelectorAll('h2').forEach(h => {
    const b = document.createElement('button');
    b.className = 'copy'; b.textContent = 'Copy section';
    b.onclick = () => {
      const parts = [];
      for (let n = h.nextElementSibling; n && n.tagName !== 'H2'; n = n.nextElementSibling) parts.push(n.innerText);
      navigator.clipboard.writeText(parts.join('\n\n')).then(() => {b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy section', 1500)});
    };
    h.appendChild(b);
  });
  const boxes = [...doc.querySelectorAll('input[type=checkbox]')];
  if (!boxes.length) return;
  const key = 'nov-updates-' + sec.id, saved = store.get(key);
  const prog = document.createElement('p'); prog.className = 'progress'; doc.prepend(prog);
  const update = () => {
    const n = boxes.filter(b => b.checked).length;
    prog.textContent = n + ' of ' + boxes.length + ' done';
  };
  boxes.forEach((b, i) => {
    b.disabled = false; b.checked = !!saved[i];
    b.closest('li').classList.toggle('done', b.checked);
    b.onchange = () => {saved[i] = b.checked; store.set(key, saved); b.closest('li').classList.toggle('done', b.checked); update()};
  });
  update();
});
const tabs = [...document.querySelectorAll('nav button')];
function show(id){
  tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.tab === id));
  document.querySelectorAll('section').forEach(s => s.hidden = s.id !== id);
}
tabs.forEach(t => t.onclick = () => {show(t.dataset.tab); history.replaceState(null, '', '#' + t.dataset.tab)});
show(tabs.some(t => t.dataset.tab === location.hash.slice(1)) ? location.hash.slice(1) : tabs[0].dataset.tab);
</script>
